name: Integration Tests - MedClinik

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-e2e:
    name: Run E2E Integration Tests (Ephemeral PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: medclinik_user
          POSTGRES_PASSWORD: medclinik_password
          POSTGRES_DB: medclinik_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Schema to Ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://medclinik_user:medclinik_password@localhost:5432/medclinik_test_db?schema=public
        run: npx prisma migrate deploy

      - name: Run E2E Integration Tests
        env:
          DATABASE_URL: postgresql://medclinik_user:medclinik_password@localhost:5432/medclinik_test_db?schema=public
          JWT_SECRET: medclinik_secret_key_2026_super_secure
        run: npx cross-env DATABASE_URL="postgresql://medclinik_user:medclinik_password@localhost:5432/medclinik_test_db?schema=public" jest --config ./test/jest-e2e.json --runInBand
