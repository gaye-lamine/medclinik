name: CI/CD Pipeline - MedClinik

on:
  push:
    branches:
      - main

jobs:
  # ─── Job 1 : Compilation & Validation ──────────────────────────────────────
  build:
    name: Build & Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build NestJS Application
        working-directory: backend
        run: npm run build

  # ─── Job 2 : Déploiement sur le VPS (uniquement si le build valide) ────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "=== 1. Synchronisation du dépôt Git ==="
            cd /var/www/html/apps/medclinik
            git pull origin main

            echo "=== 2. Re-construction et relancement des conteneurs ==="
            cd backend
            docker compose up -d --build

            echo "=== 3. Application des migrations Prisma en attente ==="
            docker compose exec -T medclinik-backend npx prisma migrate deploy

            echo "=== Déploiement CI/CD terminé avec succès ==="
