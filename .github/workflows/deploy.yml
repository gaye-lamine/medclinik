name: CI/CD Pipeline - MedClinik

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─── Job 1 : Build & Push Image Docker vers GHCR (sur le runner GitHub) ─────
  build:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/medclinik-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/medclinik-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2 : Tests d'Intégration E2E sur PostgreSQL Éphémère (Bloquant) ─────
  test:
    name: Run E2E Integration Tests (Blocking)
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: medclinik_user
          POSTGRES_PASSWORD: medclinik_password
          POSTGRES_DB: medclinik_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://medclinik_user:medclinik_password@localhost:5432/medclinik_test_db?schema=public
        run: npx prisma generate

      - name: Deploy Prisma Schema to Ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://medclinik_user:medclinik_password@localhost:5432/medclinik_test_db?schema=public
        run: npx prisma migrate deploy

      - name: Run E2E Integration Tests
        env:
          DATABASE_URL: postgresql://medclinik_user:medclinik_password@localhost:5432/medclinik_test_db?schema=public
          JWT_SECRET: medclinik_secret_key_2026_super_secure
        run: npx cross-env DATABASE_URL="postgresql://medclinik_user:medclinik_password@localhost:5432/medclinik_test_db?schema=public" jest --config ./test/jest-e2e.json --runInBand

  # ─── Job 3 : Déploiement Ultra-Rapide sur VPS (Déclenché UNIQUEMENT si Tests OK) ───
  deploy:
    name: Deploy to VPS
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Vérification de la présence des Secrets GitHub
        run: |
          MISSING=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "❌ Secret GitHub 'VPS_HOST' manquant !"; MISSING=1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "❌ Secret GitHub 'VPS_USER' manquant !"; MISSING=1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "❌ Secret GitHub 'VPS_SSH_KEY' manquant !"; MISSING=1; fi
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "👉 Allez dans Settings > Secrets and variables > Actions sur GitHub pour ajouter ces 3 secrets."
            exit 1
          fi

      - name: Déploiement via SSH sur le VPS (Utilisateur 'deployer')
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CR_PAT
          port: 22
          timeout: 10m
          command_timeout: 10m
          script_stop: true
          script: |
            set -e

            echo "=== 1. Synchronisation du dépôt Git ==="
            cd /var/www/html/apps/medclinik
            git reset --hard HEAD
            git pull origin main

            echo "=== 2. Sauvegarde automatique de la base de données (pg_dump) ==="
            mkdir -p /var/www/html/apps/medclinik/backups
            TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)
            BACKUP_FILE="/var/www/html/apps/medclinik/backups/${TIMESTAMP}-cicd-pre-deploy.sql"
            docker exec -t medclinik-db pg_dump -U medclinik_user medclinik_db > "${BACKUP_FILE}"
            
            if [ ! -s "${BACKUP_FILE}" ]; then
              echo "ERREUR CRITIQUE: La sauvegarde pg_dump a échoué ou produit un fichier vide ! Déploiement interrompu."
              exit 1
            fi
            echo "Sauvegarde réussie : ${BACKUP_FILE} ($(wc -c < "${BACKUP_FILE}") octets)"

            echo "=== 3. Authentification GHCR & Récupération de l'image pré-construite (Pull) ==="
            cd backend
            echo "$CR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull medclinik-backend

            echo "=== 4. Démarrage des conteneurs avec l'image GHCR ==="
            docker compose up -d medclinik-backend

            echo "=== 5. Application des migrations Prisma en attente ==="
            docker compose exec -T medclinik-backend npx prisma migrate deploy

            echo "=== 6. Vérification de santé post-déploiement (30s max) ==="
            HEALTHCHECK_OK=0
            for i in $(seq 1 6); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3010/api/consultations || true)
              if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "200" ]; then
                echo "Santé API confirmée (HTTP $HTTP_STATUS) au bout de $((i * 5))s"
                HEALTHCHECK_OK=1
                break
              fi
              echo "En attente du démarrage de l'API (tentative $i/6, réponse HTTP: '$HTTP_STATUS')..."
              sleep 5
            done

            if [ $HEALTHCHECK_OK -ne 1 ]; then
              echo "ERREUR CRITIQUE: Le conteneur backend ne répond pas dans le délai de 30 secondes !"
              exit 1
            fi

            echo "=== Déploiement CI/CD GHCR MedClinik terminé avec succès ==="
