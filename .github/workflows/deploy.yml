name: CI/CD Pipeline - MedClinik

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── Job 1 : Compilation & Validation ──────────────────────────────────────
  build:
    name: Build & Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build NestJS Application
        working-directory: backend
        run: npm run build

  # ─── Job 2 : Déploiement sécurisé sur le VPS ──────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Vérification de la présence des Secrets GitHub
        run: |
          MISSING=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "❌ Secret GitHub 'VPS_HOST' manquant !"; MISSING=1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "❌ Secret GitHub 'VPS_USER' manquant !"; MISSING=1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "❌ Secret GitHub 'VPS_SSH_KEY' manquant !"; MISSING=1; fi
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "👉 Allez dans Settings > Secrets and variables > Actions sur GitHub pour ajouter ces 3 secrets."
            exit 1
          fi

      - name: Configuration de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Exécution des commandes de déploiement via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            echo "=== 1. Synchronisation du dépôt Git ==="
            cd /var/www/html/apps/medclinik
            git pull origin main

            echo "=== 2. Sauvegarde automatique de la base de données (pg_dump) ==="
            mkdir -p /var/www/html/apps/medclinik/backups
            TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)
            BACKUP_FILE="/var/www/html/apps/medclinik/backups/${TIMESTAMP}-cicd-pre-deploy.sql"
            docker exec -t medclinik-db pg_dump -U medclinik_user medclinik_db > "${BACKUP_FILE}"
            
            if [ ! -s "${BACKUP_FILE}" ]; then
              echo "ERREUR CRITIQUE: La sauvegarde pg_dump a échoué ou produit un fichier vide ! Déploiement interrompu."
              exit 1
            fi
            echo "Sauvegarde réussie : ${BACKUP_FILE} ($(wc -c < "${BACKUP_FILE}") octets)"

            echo "=== 3. Re-construction et relancement des conteneurs ==="
            cd backend
            docker compose up -d --build

            echo "=== 4. Application des migrations Prisma en attente ==="
            docker compose exec -T medclinik-backend npx prisma migrate deploy

            echo "=== 5. Vérification de santé post-déploiement (30s max) ==="
            HEALTHCHECK_OK=0
            for i in $(seq 1 6); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3010/api/consultations || true)
              if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "200" ]; then
                echo "Santé API confirmée (HTTP $HTTP_STATUS) au bout de $((i * 5))s"
                HEALTHCHECK_OK=1
                break
              fi
              echo "En attente du démarrage de l'API (tentative $i/6, réponse HTTP: '$HTTP_STATUS')..."
              sleep 5
            done

            if [ $HEALTHCHECK_OK -ne 1 ]; then
              echo "ERREUR CRITIQUE: Le conteneur backend ne répond pas dans le délai de 30 secondes !"
              exit 1
            fi

            echo "=== Déploiement CI/CD MedClinik terminé avec succès ==="
          EOF
